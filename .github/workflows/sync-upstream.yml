name: 同步上游仓库

on:
  schedule:
    # 每天北京时间 06:00（UTC 22:00 前一天）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'adenll352'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 关键用带 workflow 权限的 PAT
          token: ${{ secrets.SYNC_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git || true
          git fetch upstream

      - name: 合并上游
        id: merge
        run: |
          git checkout main

          if git merge upstream/main --no-edit -m "chore: 自动同步上游 ZhuLinsen/daily_stock_analysis $(date -u +%Y-%m-%d)"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 合并成功"
          else
            echo "⚠️ 出现冲突，优先保留本地修改..."
            git checkout --ours . || true
            git add -A
            if git commit -m "chore: 自动同步上游（存在冲突，已优先保留本地修改）"; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              git merge --abort || true
              exit 1
            fi
          fi

      - name: 推送
        if: steps.merge.outputs.has_changes == 'true'
        run: |
          git push origin main
          echo "✅ 已成功推送到 origin/main"

      - name: 无变更
        if: steps.merge.outputs.has_changes != 'true'
        run: echo "ℹ️ 上游无新提交，无需同步"
