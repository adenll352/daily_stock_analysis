name: 同步上游仓库

on:
  schedule:
    # 每天北京时间 06:00 执行（UTC 22:00 前一天）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    # 只有仓库所有者才能触发（防止被 fork 的人滥用）
    if: github.repository_owner == 'adenll352'

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4
        with:
          # 需要完整历史，才能正确 merge
          fetch-depth: 0
          # 使用有写权限的 token
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git || true
          git fetch upstream

      - name: 合并上游 main 到当前 main
        id: merge
        run: |
          # 切换到 main 分支
          git checkout main

          # 尝试合并（允许无关历史）
          if git merge upstream/main --no-edit -m "chore: 自动同步上游 ZhuLinsen/daily_stock_analysis $(date -u +%Y-%m-%d)"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 合并成功"
          else
            # 如果有冲突，尝试自动解决（保留自己的修改优先）
            echo "⚠️ 出现冲突，尝试自动解决..."
            git checkout --ours . || true
            git add -A
            if git commit -m "chore: 自动同步上游（存在冲突，已优先保留本地修改）"; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "✅ 冲突已自动处理"
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "❌ 无法自动解决冲突，请手动处理"
              git merge --abort || true
              exit 1
            fi
          fi

      - name: 推送回自己的仓库
        if: steps.merge.outputs.has_changes == 'true'
        run: |
          git push origin main
          echo "✅ 已成功推送到 origin/main"

      - name: 无变更时提示
        if: steps.merge.outputs.has_changes != 'true'
        run: echo "ℹ️ 上游无新提交，无需同步"
